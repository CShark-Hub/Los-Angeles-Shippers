# Preset `strict`: the same projects as the examples. What differs is models.yaml, where every role
# runs on your own model server, so a repository's titles and labels (`judge_context` in the
# manifest, see probe.yaml beside this file) go no further than your network.
#
# Which probes exist, the admin's cap on each, and where the core finds each probe's token.
# Copied into the core's /config; every key is checked when the core starts (unknown keys fail).
projects:
  delta:                                # the synthetic fixture repository, tests/fixtures/repo-delta
    display_name: "Delta — invoicing"
    aliases: [delta, invoicing]
    access_max: code                    # metadata · code · code_model: the admin's cap, required
    probe:
      url: http://probe-delta:7000/mcp
      token_file: /run/mercury/probe-tokens/delta.token
  # A project whose probe can't read its own .mercury/probe.yaml uses a copy of the manifest's rules
  # (no version, project or display_name; the keys above give them), and runs in metadata mode:
